<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deviante</title>
    <script>
      // Apply theme before paint to avoid a flash.
      //  - Landing + the 3 docs tabs use the neutral Gestalt shell (theme-shell).
      //  - The auth flow (login/callback/no-access) uses branded theme-light.
      //  - Everything else (the app) defaults to dark, honoring the persisted
      //    'dv-theme' preference set by the in-app toggle.
      try {
        var SHELL = ['/', '/documentacao', '/casos-de-uso', '/objetos'];
        var AUTH_LIGHT = ['/login', '/register', '/auth/callback', '/no-access'];
        var cls = document.documentElement.classList;
        if (SHELL.indexOf(location.pathname) !== -1) {
          cls.add('theme-shell');
        } else if (AUTH_LIGHT.indexOf(location.pathname) !== -1
            || localStorage.getItem('dv-theme') === 'light') {
          cls.add('theme-light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Cleanup malformed cookies IMMEDIATELY before any modules load
      try {
        const cookies = document.cookie.split(';');
        for (const cookie of cookies) {
          const [name] = cookie.split('=').map(c => c.trim());
          if (name) {
            try {
              decodeURIComponent(cookie.split('=')[1] || '');
            } catch {
              // Malformed - clear it
              document.cookie = name + '=; Max-Age=0; path=/;';
            }
          }
        }
      } catch (e) {
        // Ignore
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
